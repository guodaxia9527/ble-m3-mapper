plugins { id 'com.android.application' }

android {
    namespace 'com.guodaxia.blem3mapper'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.guodaxia.blem3mapper'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.1.10-test'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('generated/captureJni')]
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += '**/libble_m3_capture.so' } }
}

def captureFile = layout.buildDirectory.file('generated/captureJni/arm64-v8a/libble_m3_capture.so')
tasks.register('compileBleCapture', Exec) {
    inputs.file(rootProject.file('../native/ble_m3_capture.c'))
    outputs.file(captureFile)
    doFirst {
        captureFile.get().asFile.parentFile.mkdirs()
        def host = System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64'
        def compiler = new File(android.sdkDirectory, "ndk/${android.ndkVersion}/toolchains/llvm/prebuilt/${host}/bin/clang" + (host.startsWith('windows') ? '.exe' : ''))
        commandLine compiler, '--target=aarch64-linux-android26', '-std=c11', '-O2', '-Wall', '-Wextra', '-Werror', '-fPIE', '-pie', rootProject.file('../native/ble_m3_capture.c'), '-o', captureFile.get().asFile
    }
}
tasks.named('preBuild').configure { dependsOn 'compileBleCapture' }

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
